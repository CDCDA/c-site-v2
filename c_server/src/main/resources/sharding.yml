rules:
  # 1. 定义读写分离规则
#  - !READWRITE_SPLITTING
#    dataSourceGroups:
#      rw_ds: # 这是一个逻辑数据源名称，包含了主库db_0和从库db_2
#        writeDataSourceName: db_0
#        readDataSourceNames:
#          - db_2
#        loadBalancerName: my_round_robin
#    loadBalancers:
#      my_round_robin:
#        type: ROUND_ROBIN

  # 2. 定义分库分表规则
  - !SHARDING
    tables:
      # 情况 A: 既分片又读写分离的表（如果需要的话，可以把 db_0 换成 rw_ds）
      # 但根据你的要求，t_order 只是普通分片，不走读写分离，所以直接写物理库名
      t_order:
        actualDataNodes: db_${0..1}.t_order_${0..2}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: database_inline
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: table_inline

      # 情况 B: 只有读写分离、不分片的表
      # 重点：这里的数据节点指向上面定义的逻辑数据源 rw_ds
      t_read_write_test:
        actualDataNodes: rw_ds.t_read_write_test

    shardingAlgorithms:
      database_inline:
        type: INLINE
        props:
          algorithm-expression: db_${id % 2}
      table_inline:
        type: INLINE
        props:
          algorithm-expression: t_order_${id % 3}

  # 3. 定义单表规则（管理所有未分片的表）
  - !SINGLE
    tables:
      - "*.*"
    defaultDataSource: db_0 # 默认所有其他表都直接走 db_0

props:
  sql-show: true # 开启日志，观察SQL具体落到了哪个库
  check.table.metadata.enabled: false